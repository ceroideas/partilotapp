<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="header-content">
        <span class="logo-text">PARTILOT</span>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-menu-button menu="main-menu" slot="end"></ion-menu-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="gestor-participaciones-content">
  <div class="gestor-participaciones-container">
    <div class="empty-state">
      <ion-icon name="ticket-outline" class="empty-icon"></ion-icon>
      <h2>Participaciones</h2>
      <p>Esta vista estará disponible próximamente</p>
    </div>
  </div>
</ion-content>
