<ion-tabs>

  <!-- Tabs para Usuario -->
  <ion-tab-bar slot="bottom" class="tab-box" *ngIf="!esVendedor() && !esGestor()">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon class="hidden_selected" aria-hidden="true" src="/assets/menu/cartera.svg"></ion-icon>
      <ion-icon class="visible_selected" aria-hidden="true" src="/assets/menu/cartera_s.svg"></ion-icon>
      <ion-label>Cartera</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon class="hidden_selected" aria-hidden="true" src="/assets/menu/historial.svg"></ion-icon>
      <ion-icon class="visible_selected" aria-hidden="true" src="/assets/menu/historial_s.svg"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon class="hidden_selected" aria-hidden="true" src="/assets/menu/home.svg"></ion-icon>
      <ion-icon class="visible_selected" aria-hidden="true" src="/assets/menu/home_s.svg"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <ion-icon class="hidden_selected" aria-hidden="true" src="/assets/menu/sorteos.svg"></ion-icon>
      <ion-icon class="visible_selected" aria-hidden="true" src="/assets/menu/sorteos_s.svg"></ion-icon>
      <ion-label>Sorteos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5" href="/tabs/tab5">
      <ion-icon class="hidden_selected" aria-hidden="true" src="/assets/menu/escaner.svg"></ion-icon>
      <ion-icon class="visible_selected" aria-hidden="true" src="/assets/menu/escaner_s.svg"></ion-icon>
      <ion-label>Escaner</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

  <!-- Tabs para Vendedor -->
  <ion-tab-bar slot="bottom" class="tab-box" *ngIf="esVendedor() && !esGestor()">
    <ion-tab-button tab="vendedor-tab1" href="/tabs/vendedor-tab1">
      <ion-icon name="cash-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="cash" class="visible_selected"></ion-icon>
      <ion-label>Venta</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="vendedor-tab2" href="/tabs/vendedor-tab2">
      <ion-icon name="list-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="list" class="visible_selected"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="vendedor-tab3" href="/tabs/vendedor-tab3">
      <ion-icon name="home-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="home" class="visible_selected"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="vendedor-tab4" href="/tabs/vendedor-tab4">
      <ion-icon name="ticket-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="ticket" class="visible_selected"></ion-icon>
      <ion-label>Particip.</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="vendedor-tab5" href="/tabs/vendedor-tab5">
      <ion-icon name="qr-code-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="qr-code" class="visible_selected"></ion-icon>
      <ion-label>Escaner</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

  <!-- Tabs para Gestor -->
  <ion-tab-bar slot="bottom" class="tab-box" *ngIf="esGestor()">
    <ion-tab-button tab="gestor-tab1" href="/tabs/gestor-tab1">
      <ion-icon name="ticket-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="ticket" class="visible_selected"></ion-icon>
      <ion-label>Particip.</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="gestor-tab2" href="/tabs/gestor-tab2">
      <ion-icon name="people-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="people" class="visible_selected"></ion-icon>
      <ion-label>Vende.</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="gestor-tab3" href="/tabs/gestor-tab3">
      <ion-icon name="home-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="home" class="visible_selected"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="gestor-tab4" href="/tabs/gestor-tab4">
      <ion-icon name="return-down-back-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="return-down-back" class="visible_selected"></ion-icon>
      <ion-label>Devoluc.</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="gestor-tab5" href="/tabs/gestor-tab5">
      <ion-icon name="cash-outline" class="hidden_selected"></ion-icon>
      <ion-icon name="cash" class="visible_selected"></ion-icon>
      <ion-label>Pago</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
