<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <div class="header-content">
        <span class="logo-text">PARTILOT</span>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-menu-button menu="main-menu" slot="end"></ion-menu-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="venta-content">
  <div class="venta-container">
    
    <!-- Selector de rol (Usuario/Vendedor/Gestor) -->
    <div class="rol-selector">
      <ion-button 
        class="rol-button" 
        fill="clear"
        (click)="cambiarRol('usuario')">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        Usuario
      </ion-button>
      <ion-button 
        class="rol-button active" 
        fill="clear"
        [disabled]="true">
        <ion-icon name="bag-outline" slot="start"></ion-icon>
        Vendedor
      </ion-button>
      <ion-button 
        class="rol-button" 
        fill="clear"
        (click)="cambiarRol('gestor')">
        <ion-icon name="people-outline" slot="start"></ion-icon>
        Gestor
      </ion-button>
    </div>

    <!-- Información -->
    <div class="info-card figma-card">
      <h2>Selecciona el tipo de venta</h2>
      <p>Elige cómo quieres realizar la venta de la participación</p>
    </div>

    <!-- Opciones de venta -->
    <div class="opciones-venta">
      <ion-card class="opcion-card" (click)="irAVentaQR()">
        <ion-card-content>
          <div class="opcion-icon">
            <ion-icon name="qr-code" size="large"></ion-icon>
          </div>
          <h3>Venta QR</h3>
          <p>Escanear código QR del cliente para generar la participación</p>
          <ion-button fill="outline" expand="block" class="opcion-button">
            Seleccionar
          </ion-button>
        </ion-card-content>
      </ion-card>

      <ion-card class="opcion-card" (click)="irAVentaManual()">
        <ion-card-content>
          <div class="opcion-icon">
            <ion-icon name="create" size="large"></ion-icon>
          </div>
          <h3>Venta Manual</h3>
          <p>Ingresar manualmente los datos del cliente y la participación</p>
          <ion-button fill="outline" expand="block" class="opcion-button">
            Seleccionar
          </ion-button>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
