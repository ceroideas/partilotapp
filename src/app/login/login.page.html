<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title></ion-title>
    <div class="header-content">
      <img src="/assets/logo_menu.svg" alt="PARTILOT" class="logo-image">
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    
    <div class="login-card figma-card">
      <!-- Selector de tipo de acceso: Usuario | Vendedor -->
      <ion-segment [value]="tipoAcceso" (ionChange)="setTipoAcceso($event)">
        <ion-segment-button value="usuario">
          <ion-label>Usuario</ion-label>
        </ion-segment-button>
        <ion-segment-button value="vendedor">
          <ion-label>Vendedor</ion-label>
        </ion-segment-button>
      </ion-segment>

      <h2 class="login-title" *ngIf="tipoAcceso === 'usuario'">Acceso Usuario</h2>
      <p class="login-subtitle" *ngIf="tipoAcceso === 'usuario'">Inicia sesión para ver tu cartera y participaciones</p>
      <h2 class="login-title" *ngIf="tipoAcceso === 'vendedor'">Acceso Vendedor</h2>
      <p class="login-subtitle" *ngIf="tipoAcceso === 'vendedor'">Inicia sesión para gestionar tus ventas</p>

      <form (ngSubmit)="onSubmit()">
        <ion-item class="input-item">
          <ion-label position="floating">Email</ion-label>
          <ion-input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="tu@email.com"
            inputmode="email"
            required>
          </ion-input>
        </ion-item>

        <ion-item class="input-item">
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            required>
          </ion-input>
        </ion-item>

        <ion-button 
          type="submit" 
          class="login-button" 
          expand="block">
          Iniciar sesión
        </ion-button>
      </form>
    </div>

  </div>
</ion-content>
