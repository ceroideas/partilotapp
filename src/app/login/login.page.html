<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    <div class="brand-section">
      <img src="/assets/logo_menu.svg" alt="PARTILOT" class="logo-image">
      <h1 class="welcome-title">Bienvenido</h1>
      <p class="welcome-subtitle">de nuevo a <strong>PARTILOT</strong></p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-wrap">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <ion-input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email de Acceso"
          inputmode="email"
          class="input-field"
          required>
        </ion-input>
      </div>

      <div class="input-wrap">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Contraseña"
          class="input-field"
          required>
        </ion-input>
        <button type="button" class="input-icon-right" (click)="togglePassword()" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <a href="javascript:void(0)" class="link-recordar" (click)="recordarPassword()">Recordar Contraseña</a>

      <div class="loading-inline" *ngIf="loading">
        <ion-spinner name="crescent"></ion-spinner>
        <span>Iniciando sesión...</span>
      </div>
      <ion-button type="submit" class="btn-accede" [disabled]="loading" expand="block">
        Accede
      </ion-button>
    </form>

    <div class="biometric-row">
      <button type="button" class="btn-biometric" (click)="loginBiometrico()" [disabled]="!biometricReady || loading" aria-label="Acceso biométrico">
        <ion-icon [name]="biometricIcon"></ion-icon>
      </button>
    </div>
    <ion-item lines="none" class="biometric-toggle-row" *ngIf="biometricReady">
      <ion-label>Recordar acceso biométrico</ion-label>
      <ion-toggle slot="end" [checked]="biometricEnabled" (ionChange)="onBiometricToggle($event)"></ion-toggle>
    </ion-item>

    <p class="footer-registro">
      Aún no tienes cuenta? <a href="javascript:void(0)" class="link-registro" (click)="irARegistro()">Regístrate</a>
    </p>
  </div>
</ion-content>
